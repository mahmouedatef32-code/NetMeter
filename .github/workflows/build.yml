
name: Build NetMeter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q NetMeterAndroid_MobileBuild.zip -d extracted
          cp -R extracted/NetMeterAndroid/app .
          cp extracted/NetMeterAndroid/build.gradle .
          cp extracted/NetMeterAndroid/settings.gradle .
          cp extracted/NetMeterAndroid/gradle.properties .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMeter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
